name: Auto Flat ZIP + Tests

on:
  workflow_dispatch:
  release:
    types: [released, prereleased, edited]
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  test_code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: find . -name "*.sh" -print0 | xargs -0 shellcheck -e SC2148

  attach-zip-and-notify:
    needs: test_code
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Env
        run: |
          echo "TIMESTAMP=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV
          echo "ZIP_FILE=SoundATMOSphere-1.55-Stable.zip" >> $GITHUB_ENV

      # 规避 zip 123 错误：排除多余目录
      - name: Create Clean ZIP
        run: |
          zip -r "${{ env.ZIP_FILE }}" . \
            -x ".git/*" -x ".github/*" -x "*.gitignore" -x ".*"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 先判断事件类型，写入消息变量，避免非法表达式
      - name: Prepare Telegram Message
        if: github.event_name == 'release'
        run: |
          echo "MSG=🚀 **New Release Available!**
📦 Version: ${{ github.event.release.tag_name }}
⏰ Build Time: ${{ env.TIMESTAMP }}
[🔗 View Full Changelog](${{ github.event.release.html_url }})" >> $GITHUB_ENV

      - name: Prepare Manual Message
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "MSG=🔧 **Manual Build Triggered**
📦 Version: 1.55 Stable
⏰ Build Time: ${{ env.TIMESTAMP }}" >> $GITHUB_ENV

      - name: Send to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          document: ${{ env.ZIP_FILE }}
          message: ${{ env.MSG }}


