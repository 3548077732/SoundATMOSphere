name: Auto Flat ZIP

on:
  release:
    types: [published, edited, prereleased]

permissions:
  contents: write

jobs:
  attach-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create flat ZIP
        run: |
          zip -r SoundATMOSphere-beta.zip . -x "*.git*"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: SoundATMOSphere-beta.zip
