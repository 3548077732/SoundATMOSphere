name: Auto Flat ZIP + Tests

on:
  release:
    types: [released, prereleased, edited]
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  test_code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: find . -name "*.sh" -print0 | xargs -0 shellcheck -e SC2148
  attach-zip-and-notify:
    needs: test_code
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get current date
        run: echo "TIMESTAMP=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: Create flat ZIP
        run: zip -r SoundATMOSphere-1.55-Stable.zip . -x "*.git*"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: SoundATMOSphere-1.55-Stable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send File to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          document: SoundATMOSphere-1.55-Stable.zip
          message: |
            🚀 **New release available!**
            📦 Version: `${{ github.event.release.tag_name }}`
            
            File ready for download 👇
            [🔗 View full changelog on GitHub](${{ github.event.release.html_url }})          message: |
            🚀 **New release available!**
            📦 Version: `${{ github.event.release.tag_name }}`
            
            File ready for download 👇
            [🔗 View full changelog on GitHub](${{ github.event.release.html_url }})
