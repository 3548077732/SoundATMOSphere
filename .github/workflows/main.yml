name: Auto Flat ZIP + Tests

on:
  workflow_dispatch:
  release:
    types: [released, prereleased, edited]
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  test_code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: find . -name "*.sh" -print0 | xargs -0 shellcheck -e SC2148

  attach-zip-and-notify:
    needs: test_code
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get current date & version
        run: |
          echo "TIMESTAMP=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV
          echo "ZIP_NAME=SoundATMOSphere-1.55-Stable.zip" >> $GITHUB_ENV

      # 修复zip 123错误：排除更多冗余文件、不打包git、action缓存、隐藏目录
      - name: Create clean flat ZIP
        run: |
          zip -r "${{ env.ZIP_NAME }}" . \
            -x "*.git*" -x ".github/workflows/*" -x ".github/*" -x ".*" -x "__MACOSX" -x "node_modules/*"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 兼容手动触发：判断是否为release事件，避免变量为空报错
      - name: Send File to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          document: ${{ env.ZIP_NAME }}
          message: |
            🚀 **New Build Released!**
            📦 Version: 1.55 Stable
            ⏰ Build Time: ${{ env.TIMESTAMP }}
            ${{ github.event_name == 'release' && '[🔗 View GitHub Changelog](' + github.event.release.html_url + ')' || '🔧 Manual Workflow Triggered' }}

