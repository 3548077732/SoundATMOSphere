name: Auto Flat ZIP

on:
  release:
    types: [released, prereleased, edited]

permissions:
  contents: write

jobs:
  attach-zip-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get current date
        run: echo "TIMESTAMP=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: Create flat ZIP
        run: zip -r SoundATMOSphere-beta-${{ env.TIMESTAMP }}.zip . -x "*.git*"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: SoundATMOSphere-beta-${{ env.TIMESTAMP }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send File to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          document: SoundATMOSphere-beta-${{ env.TIMESTAMP }}.zip
          message: |
            🚀 **New release available!**
            📦 Version: `${{ github.event.release.tag_name }}`
            
            File ready for download 👇
            [🔗 View full changelog on GitHub](${{ github.event.release.html_url }})
