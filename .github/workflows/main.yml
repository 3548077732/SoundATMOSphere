name: Auto Flat ZIP + Tests

on:
  workflow_dispatch:
  release:
    types: [released, prereleased, edited]
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test_code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run ShellCheck
        run: find . -name "*.sh" -print0 | xargs -0 shellcheck -e SC2148

  attach-zip-and-notify:
    needs: test_code
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare clean build folder
        run: |
          mkdir -p build
          cp -r ./* build/
          rm -rf build/.git build/.github

      - name: Create clean ZIP
        run: cd build && zip -r ../SoundATMOSphere-1.55-Stable.zip *

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: SoundATMOSphere-1.55-Stable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send File to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          document: SoundATMOSphere-1.55-Stable.zip
          message: New Build Ready
