name: Auto Flat ZIP + Tests a

on:
  workflow_dispatch:
  release:
    types: [released, prereleased, edited]
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: write

jobs:
  test_code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

  attach-zip-and-notify:
    needs: test_code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build clean package
        run: |
          mkdir -p tmp
          rsync -av --exclude '.git' --exclude '.github' ./ tmp/
          cd tmp
          zip -r ../SoundATMOSphere-1.55-Stable.zip *
          cd ..
          rm -rf tmp

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: SoundATMOSphere-1.55-Stable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
